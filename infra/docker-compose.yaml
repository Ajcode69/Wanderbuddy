# WanderBuddy — Local Development Stack
# Usage: docker compose -f infra/docker-compose.yaml up --build

services:
  # ─── Reverse Proxy ───────────────────────────────────────────
  proxy:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      agent:
        condition: service_healthy
    networks:
      - wanderbuddy

  # ─── API Service ─────────────────────────────────────────────
  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    env_file:
      - ../apps/api/.env
    environment:
      - NODE_ENV=development
      - PORT=4000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - wanderbuddy

  # ─── Web Frontend ───────────────────────────────────────────
  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - wanderbuddy

  # ─── Agent Service ──────────────────────────────────────────
  agent:
    build:
      context: ../agent
      dockerfile: Dockerfile
    ports:
      - "4100:4100"
    env_file:
      - ../agent/.env
    environment:
      - NODE_ENV=development
      - PORT=4100
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4100/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - wanderbuddy

networks:
  wanderbuddy:
    driver: bridge
