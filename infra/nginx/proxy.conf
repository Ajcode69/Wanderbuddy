# Nginx reverse proxy config for local docker-compose
# Routes all traffic through a single entry point

upstream api_upstream {
    server api:4000;
}

upstream web_upstream {
    server web:80;
}

upstream agent_upstream {
    server agent:4100;
}

server {
    listen 80;
    server_name _;

    # ─── API requests ────────────────────────────────────────
    location /api/ {
        proxy_pass http://api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── Health check passthrough ────────────────────────────
    location /api/health {
        proxy_pass http://api_upstream/health;
    }

    # ─── Agent requests ──────────────────────────────────────
    location /agent/ {
        proxy_pass http://agent_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeouts for AI processing
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ─── Web frontend (catch-all) ────────────────────────────
    location / {
        proxy_pass http://web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
