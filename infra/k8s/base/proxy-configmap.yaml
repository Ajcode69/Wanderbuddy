apiVersion: v1
kind: ConfigMap
metadata:
  name: proxy-config
  namespace: wanderbuddy
data:
  nginx.conf: |
    upstream api_upstream {
        server api.wanderbuddy.svc.cluster.local:4000;
    }

    upstream web_upstream {
        server web.wanderbuddy.svc.cluster.local:80;
    }

    upstream agent_upstream {
        server agent.wanderbuddy.svc.cluster.local:4100;
    }

    server {
        listen 80;
        server_name _;

        # API
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://api_upstream/health;
        }

        # Agent
        location /agent/ {
            proxy_pass http://agent_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Web (catch-all)
        location / {
            proxy_pass http://web_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
