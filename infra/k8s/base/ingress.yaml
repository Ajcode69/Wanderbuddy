apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wanderbuddy-ingress
  namespace: wanderbuddy
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: wanderbuddy.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
          - path: /agent
            pathType: Prefix
            backend:
              service:
                name: agent
                port:
                  number: 4100
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
