apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: wanderbuddy
  labels:
    app: agent
    app.kubernetes.io/part-of: wanderbuddy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      containers:
        - name: agent
          image: wanderbuddy/agent:latest
          ports:
            - containerPort: 4100
          envFrom:
            - secretRef:
                name: agent-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4100
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
